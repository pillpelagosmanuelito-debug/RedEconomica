name: Compilar RedEconómica (APK debug)

# Genera el APK de depuración y ejecuta pruebas + lint cada vez que se hace
# push a la rama principal, o manualmente desde la pestaña Actions.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Tests, lint y APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permiso de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Limpiar
        run: ./gradlew clean --no-daemon

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Lint (debug)
        run: ./gradlew lintDebug --no-daemon

      - name: Compilar APK de depuración
        run: ./gradlew assembleDebug --no-daemon

      - name: Renombrar el APK
        run: |
          mkdir -p artefactos
          cp app/build/outputs/apk/debug/app-debug.apk artefactos/RedEconomica-v1.0.0.apk
          sha256sum artefactos/RedEconomica-v1.0.0.apk | tee artefactos/RedEconomica-v1.0.0.apk.sha256

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: RedEconomica-v1.0.0-apk
          path: artefactos/
          if-no-files-found: error

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
